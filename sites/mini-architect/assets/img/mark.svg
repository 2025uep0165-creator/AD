<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mini Architect">
  <title>Mini Architect</title>
  <!-- drawing frame -->
  <rect x="7" y="7" width="106" height="106" rx="5" fill="none" stroke="#ebc067" stroke-width="5"/>
  <!-- the M, drawn as an architect's roofline -->
  <path d="M28 88V44l32 26 32-26v44" fill="none" stroke="#f7f7f5" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- setting-out mark under the apex -->
  <circle cx="60" cy="97" r="4.5" fill="#ebc067"/>
</svg>
